<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:6px 14px 12px;flex:none">
<div style="display:flex;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.5));backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.8);border-radius:28px;box-shadow:0 12px 28px rgba(46,96,120,.18);padding:8px 12px">
<sc-for list="{{ left }}" as="t" hint-placeholder-count="2">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ t.color }};padding:6px 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg>
<span style="width:4px;height:4px;border-radius:99px;background:{{ t.dot }}"></span>
</div>
</sc-for>
<div style="width:46px;height:46px;border-radius:99px;background:linear-gradient(160deg,rgba(116,176,200,.98),rgba(52,104,128,.95));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 10px 22px rgba(46,96,120,.35),inset 0 1px 0 rgba(255,255,255,.5);margin:0 6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
<sc-for list="{{ right }}" as="t" hint-placeholder-count="2">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ t.color }};padding:6px 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg>
<span style="width:4px;height:4px;border-radius:99px;background:{{ t.dot }}"></span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;402px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Workflows&quot;,&quot;Approvals&quot;,&quot;Reports&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Home';
    const icons = {
      Home: 'M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z',
      Workflows: 'M4 5h6v6H4zM14 13h6v6h-6zM10 8h4v8',
      Approvals: 'M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18zM8.5 12.2l2.4 2.4 4.6-5',
      Reports: 'M7 3h7l4 4v14H7zM13.5 3v4.5H18M10 12.5h4.5M10 16h4.5'
    };
    const mk = l => ({ d: icons[l], color: l === a ? '#2E5163' : '#9DB4BE', dot: l === a ? '#447F98' : 'transparent' });
    return { left: ['Home','Workflows'].map(mk), right: ['Approvals','Reports'].map(mk) };
  }
}
</script>
</body>
</html>
